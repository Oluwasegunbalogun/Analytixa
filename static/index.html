async function viewAudit(v){S.audTab=S.audTab||"ledger";const t=S.audTab;
  v.innerHTML=`<h1>Audit trail</h1><p class="lede">Every agent action and human decision, in order. Each entry is chained to the one before it, so an edit or deletion anywhere is detected.</p>
   <div class="tabs" role="tablist"><button role="tab" aria-selected="${t=="ledger"}" onclick="S.audTab='ledger';viewAudit($('view'))">Ledger</button><button role="tab" aria-selected="${t=="ext"}" onclick="S.audTab='ext';viewAudit($('view'))">What reached outside systems</button></div><div id="ab">Loading…</div>`;
  if(t=="ledger"){const [vf,l]=await Promise.all([api("/api/ledger/verify"),api("/api/ledger?limit=150"+(S.ledRun?"&run_id="+encodeURIComponent(S.ledRun):""))]);
    $("ab").innerHTML=`<div class="${vf.ok?"notice info":"notice bad"}">${vf.ok?`<b>The chain is intact.</b> All ${vf.entries.toLocaleString()} entries check out.`:`<b>The chain is broken at entry ${vf.broken_at}.</b> Something was changed after it was written.`}</div>
     <div class="row" style="margin:12px 0"><input placeholder="Show one task, for example RUN-1a2b3c4d" value="${h(S.ledRun||"")}" style="max-width:320px" aria-label="Filter by task" onchange="S.ledRun=this.value.trim();viewAudit($('view'))">${S.ledRun?`<button class="link" onclick="S.ledRun='';viewAudit($('view'))">Show everything</button>`:""}<span class="hint right">Latest ${l.rows.length} of ${l.total.toLocaleString()}</span></div>
     <div class="panel flush" style="overflow-x:auto"><table><tr><th class="n">#</th><th>When</th><th>Who</th><th>What</th><th>Task</th></tr>${l.rows.map(r=>`<tr class="click" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><td class="n">${r.seq}</td><td style="white-space:nowrap">${when(r.ts)}</td><td>${h(actorName(r.actor))}</td><td>${h(r.event.replace(/_/g," "))}${r.tool_id?` <span class="tag">${r.tool_id}</span>`:""}${r.level?` <span class="hint">${r.level}</span>`:""}</td><td class="hint">${h(r.run_id||"")}</td></tr>
      <tr hidden><td colspan="5"><pre>${h(JSON.stringify({payload:r.payload?JSON.parse(r.payload):null,policy_version:r.policy_version,model_version:r.model_version,prev_hash:r.prev_hash,hash:r.hash},null,1))}</pre></td></tr>`).join("")}</table></div>`}
  else{const e=await api("/api/external");const N={ext_loan_decisions:"Loan system decisions",ext_cases:"AML case queue",ext_holds:"Payment holds",ext_str_filings:"Reports to the financial intelligence unit",ext_campaigns:"Customer offers",ext_cash_orders:"Cash-in-transit orders"};
    $("ab").innerHTML=`<p class="hint">These systems are simulated. Each row was written by an agent action after the safety layer allowed it.</p>`+Object.entries(e).map(([k,rows])=>`<h3>${N[k]||k}</h3>${rows.length?`<div class="panel flush" style="overflow-x:auto"><table><tr>${Object.keys(rows[0]).map(c=>`<th>${c.replace(/_/g," ")}</th>`).join("")}</tr>${rows.slice(0,12).map(r=>`<tr>${Object.values(r).map(x=>`<td class="hint">${h(String(x??"").slice(0,80))}</td>`).join("")}</tr>`).join("")}</table></div>`:'<p class="hint">Nothing yet.</p>'}`).join("")}}
function actorName(a){if(a.startsWith("human:")){const p=a.split(":");return roleT(p[1])+(p[2]?" ("+p[2]+")":"")}return S.meta.agents[a]||a.replace(/^L7\./,"Safety layer: ").replace(/_/g," ")}

/* ════════════ About ════════════ */
async function viewAbout(v){S.abTab=S.abTab||"arch";const t=S.abTab;
  v.innerHTML=`<h1>How the system works</h1><p class="lede">Analytixa follows HAARA, an eight-layer architecture for human-in-the-loop agentic analytics. Agents reach data and models only through governed tools, and a rule-based safety layer checks every call.</p>
   <div class="tabs" role="tablist"><button role="tab" aria-selected="${t=="arch"}" onclick="S.abTab='arch';viewAbout($('view'))">Layers</button><button role="tab" aria-selected="${t=="tools"}" onclick="S.abTab='tools';viewAbout($('view'))">Tools and agents</button><button role="tab" aria-selected="${t=="eval"}" onclick="S.abTab='eval';viewAbout($('view'))">Evaluation</button></div><div id="abb"></div>`;
  const T=S.meta.tools,by=l=>T.filter(t=>t.layer==l).map(t=>`<span class="tag" title="${h(t.name)}">${t.id}</span>`).join(" ");
  if(t=="arch"){const L=[["L8 Human interaction","Sign-in, home, approvals, the credit discussion, policies, audit trail"],
   ["L7 Oversight control plane","Autonomy governor, checkpoint manager, action guard, steering, uncertainty estimator, escalation router. Rule-based code, no language model.","l7"],
   ["L6.2 Orchestrator","Turns each plan into ordered steps, saves state after every step, pauses for decisions, resumes and reruns"],
   ["L6.1 Agents",Object.values(S.meta.agents).join(", ")],["L5.5 Connection tools",by("L5.5")+" Loan system, payment holds, report filing, customer offers, cash orders (simulated)"],
   ["L5.4 Cognitive tools",by("L5.4")],["L5.3 Explanation tools",by("L5.3")],["L5.2 Model tools",by("L5.2")],["L5.1 Data tools",by("L5.1")],
   ["L4 Explainable AI","Exact additive attributions, reason codes, recourse, stability and fairness checks"],
   ["L3 Models",S.meta.models.map(m=>m.version).join(", ")+", optional hosted language model"],
   ["L2 Semantic and policy","Versioned bank policies and approved metric definitions"],
   ["L1 Data and provenance",`PostgreSQL schema “${h(S.meta.database.schema)}” on ${h(S.meta.database.host)}: ${S.meta.counts.customers.toLocaleString()} customers, ${S.meta.counts.transactions.toLocaleString()} transactions, model registry, hash-chained ledger`]];
    $("abb").innerHTML=`<div class="panel">${L.map(([n,d,c])=>`<div class="layer ${c||""}"><b>${n}</b><div>${d}</div></div>`).join("")}</div>
    <div class="panel"><h2>Autonomy levels</h2><div class="kv"><div>A0 Manual</div><div>A person does it</div><div>A1 Approve before</div><div>Outside effects, report filing (always), credit decisions</div><div>A2 Review after</div><div>Low-confidence steps</div><div>A3 Notify</div><div>Internal writes and actions within the bank's limits</div><div>A4 Autonomous</div><div>Reading and calculating</div></div></div>`}
  else if(t=="tools")$("abb").innerHTML=`<div class="panel flush" style="overflow-x:auto"><table><tr><th>Tool</th><th>Layer</th><th>Type</th><th>Policy check</th><th>Limit</th></tr>${T.map(t=>`<tr><td><span class="tag">${t.id}</span> <b>${h(t.name)}</b><div class="hint">${h(t.doc)}</div></td><td>${t.layer}</td><td>${t.class}</td><td>${t.has_precheck?"Yes":""}</td><td>${t.has_envelope?"Yes":""}</td></tr>`).join("")}</table></div>
    <h2>What each agent may use</h2><div class="panel flush"><table>${Object.entries(S.meta.scopes).map(([a,t])=>`<tr><td><b>${h(S.meta.agents[a])}</b></td><td>${t.map(x=>`<span class="tag">${x}</span>`).join(" ")}</td></tr>`).join("")}</table></div>`;
  else{const e=await api("/api/evaluation");if(e.available===false){$("abb").innerHTML=`<div class="panel empty">No evaluation yet. Run <code>python evaluate.py</code> on the server, then reload.</div>`;return}
    if(e.summary){$("abb").innerHTML=evalV2(e);return}
    $("abb").innerHTML=`<p class="hint">${h(e.description)}</p><div class="panel flush" style="overflow-x:auto"><table><tr><th>Measure</th>${e.configs.map(c=>`<th class="n">${h(c)}</th>`).join("")}</tr>
     ${e.comparison.map(r=>`<tr><td>${h(r.measure)}${r.note?`<div class="hint">${h(r.note)}</div>`:""}</td>${e.configs.map(c=>`<td class="n">${h(r[c])}</td>`).join("")}</tr>`).join("")}</table></div>
     <div class="cols">${e.sections.map(s=>`<div class="panel"><h2>${h(s.title)}</h2><div class="kv">${s.items.map(i=>`<div>${h(i[0])}</div><div>${h(i[1])}</div>`).join("")}</div></div>`).join("")}</div>`}}

function evalV2(e){const c=e.summary.comparative,cf=["autonomous","guarded","uniform","haara"].filter(k=>c[k]),T={autonomous:"Autonomous",guarded:"Guards only",uniform:"Approve every step",haara:"HAARA"};
  const ci=(x,d=1)=>x.ci95?` (${Number(x.ci95[0]).toFixed(d)} to ${Number(x.ci95[1]).toFixed(d)})`:"";
  const rows=[["Unsafe scenario runs",k=>`${c[k].unsafe_scenarios} of ${c[k].scenario_runs}`],
    ["Unsafe rate, 95% interval",k=>`${(c[k].unsafe_rate*100).toFixed(1)}% (${(c[k].unsafe_rate_ci95[0]*100).toFixed(1)} to ${(c[k].unsafe_rate_ci95[1]*100).toFixed(1)})`],
    ["Human decisions per bank",k=>c[k].decision_requests_per_seed.mean.toFixed(1)+ci(c[k].decision_requests_per_seed)],
    ["Human decisions per scenario",k=>c[k].decision_requests_per_scenario.toFixed(2)],
    ["External actions per bank",k=>c[k].external_actions_per_seed.mean.toFixed(1)],
    ["Unsafe probes stopped",k=>`${e.summary.probes[k].unsafe_stopped} of ${e.summary.probes[k].unsafe_total}`]];
  const o=e.summary.oversight,b=e.summary.boundaries,sm=e.summary.semantic,v=e.summary.validity,A=sm.A_no_confirmation,B=sm.B_review_and_correct,C=sm.C_seeded_error;
  const m=e.manifest||{};
  return `<p class="hint">Reproducible benchmark on ${c.haara.seeds} synthetic banks, with expected outcomes written before the run. Run ${h(String(m.finished||e.generated_at||"").slice(0,16).replace("T"," "))}, code ${h(m.code_fingerprint||"")}. Rerun with <code>python evaluate.py</code>.</p>
   <div class="panel flush" style="overflow-x:auto"><table><tr><th>Measure</th>${cf.map(k=>`<th class="n">${T[k]}</th>`).join("")}</tr>${rows.map(([t,f])=>`<tr><td>${t}</td>${cf.map(k=>`<td class="n">${f(k)}</td>`).join("")}</tr>`).join("")}</table></div>
   <div class="cols"><div class="panel"><h2>Oversight robustness</h2><p><b>${o.pass} of ${o.total}</b> tests passed.</p><div class="kv">${Object.entries(o.by_family).map(([k,x])=>`<div>${h(cap(k.replace(/_/g," ")))}</div><div>${h(x)}</div>`).join("")}</div>
     <p class="hint">Credit policy boundary cases: ${b.pass} of ${b.total} passed.</p></div>
    <div class="panel"><h2>Questions and corrections</h2><div class="kv"><div>Without confirmation</div><div>${A.safe_final} of ${A.items} safe, ${A.wrong_answers_released} wrong answers released</div>
     <div>With review and correction</div><div>${B.safe_final} of ${B.items} safe, ${B.wrong_answers_released} wrong answers accepted</div>
     <div>Seeded errors fixed by one plain-words correction</div><div>${C.text_recovered} of ${C.items}</div><div>Every correction in the ledger</div><div>${C.every_correction_in_ledger?"Yes":"No"}</div></div></div>
    <div class="panel"><h2>Analytical validity</h2><div class="kv"><div>Credit model AUC</div><div>${v.credit_auc.mean}${ci(v.credit_auc,3)}</div><div>Credit calibration error</div><div>${v.credit_ece.mean}</div>
     <div>Downturn: predicted against observed default</div><div>${(v.shift_mean_predicted.mean*100).toFixed(1)}% against ${(v.shift_observed_default.mean*100).toFixed(1)}%</div>
     <div>Churn model AUC</div><div>${v.churn_auc.mean}</div><div>AML precision and recall</div><div>${v.aml_precision.mean} and ${v.aml_recall.mean}</div>
     <div>Cash forecast error (MAPE)</div><div>${(v.cash_mape.mean*100).toFixed(1)}%</div></div></div>
    <div class="panel"><h2>What this does not show</h2><p class="hint" style="margin:0">Decisions came from a scripted reviewer that follows policy, and the data is synthetic. The numbers count requests and prevented actions. They do not measure how long people take or how well they decide.</p></div></div>`}

/* ════════════ Settings ════════════ */
async function openSettings(){document.querySelector(".menu")?.remove();let l=S.meta.llm;try{l=await api("/api/llm");S.meta.llm=l}catch(e){}
  const last=l.last||{};
  $("modal").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="sh"><form class="box" id="sf"><h2 id="sh">Language model</h2>
  <p class="hint">The language model reads questions first, writes summaries and reads officers' messages. If a model is busy or fails, the next one in the list is tried, and every switch is recorded in the audit trail. If every model fails, rules and templates take over. A key pasted here stays in server memory only. A key saved in config.env as OPENROUTER_API_KEY loads at every start.</p>
  <p>Status: <b>${l.available?"Connected":"Off. Rules and templates are in use."}</b>${last.model?`<br><span class="hint">Last answer from ${h(last.model)}${last.fallbacks_used?` after ${last.fallbacks_used} unavailable model(s)`:""}.</span>`:last.tried?.length?`<br><span class="hint">Last call: no model answered, rules were used.</span>`:""}</p>
  <label class="f" for="k">OpenRouter API key ${l.openrouter_key_set?'<span class="hint">(set)</span>':""}</label><input id="k" type="password" placeholder="${l.openrouter_key_set?"Leave empty to keep the current key":"Paste a key to connect"}" autocomplete="off">
  <label class="f" for="mdl" style="margin-top:12px">First model</label><input id="mdl" value="${h(l.model)}">
  <label class="f" for="fb" style="margin-top:12px">Backup models, tried in order</label><textarea id="fb" rows="4" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px">${h((l.fallbacks||[]).join("\n"))}</textarea>
  <label class="f" for="ak" style="margin-top:12px">Anthropic API key, used last if every OpenRouter model fails ${l.anthropic_key_set?'<span class="hint">(set)</span>':'<span class="hint">(optional)</span>'}</label><input id="ak" type="password" placeholder="${l.anthropic_key_set?"Leave empty to keep the current key":"Optional"}" autocomplete="off">
  <label class="f" for="am" style="margin-top:12px">Anthropic model</label><input id="am" value="${h(l.anthropic_model||"")}">
  <label class="check" style="margin-top:12px"><input type="checkbox" id="en" ${l.enabled?"checked":""}> Use the language model when a key is set</label>
  ${(l.chain||[]).length?`<p class="hint" style="margin-top:10px">Order now: ${l.chain.map(x=>h(x.replace(/^openrouter:/,""))).join(", then ")}.</p>`:""}
  <div class="row" style="margin-top:18px"><button class="primary" type="submit">Save</button><button type="button" onclick="$('modal').innerHTML=''">Cancel</button></div></form></div>`;
  $("sf").onsubmit=async e=>{e.preventDefault();const b={model:$("mdl").value,enabled:$("en").checked,fallbacks:$("fb").value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean),anthropic_model:$("am").value};
    const k=$("k").value.trim();if(k)b.api_key=k;const ak=$("ak").value.trim();if(ak)b.anthropic_key=ak;
    try{const r=await post("/api/settings",b);S.meta.llm=r;$("modal").innerHTML="";toast(r.available?`Language model connected. ${r.chain.length} model(s) in order.`:"Language model off. Rules and templates are in use.")}catch(x){toast(x.message)}}}
async function openDiagnostics(){document.querySelector(".menu")?.remove();
  $("modal").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dh"><div class="box" style="width:min(860px,100%)"><h2 id="dh">Diagnostic log</h2>
   <p class="hint">What the server did recently, how long each request took, and every error with its reference. Passwords, keys and the database password are removed. Copy it and paste it when you report a problem.</p>
   <textarea id="dlog" rows="18" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre">Loading…</textarea>
   <div class="row" style="margin-top:12px"><button class="primary" id="dcopy">Copy</button><button id="dsave">Save as file</button><button onclick="openDiagnostics()">Refresh</button><button class="right" onclick="$('modal').innerHTML=''">Close</button></div></div></div>`;
  try{const d=await api("/api/diagnostics?lines=400");$("dlog").value=d.text;$("dlog").scrollTop=$("dlog").scrollHeight}catch(e){$("dlog").value=e.message}
  $("dcopy").onclick=async()=>{try{await navigator.clipboard.writeText($("dlog").value);toast("Copied. Paste it into your message.")}catch(e){$("dlog").select();document.execCommand("copy");toast("Copied.")}};
  $("dsave").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("dlog").value],{type:"text/plain"}));a.download="analytixa-diagnostic-log.txt";a.click();URL.revokeObjectURL(a.href)}}
document.addEventListener("keydown",e=>{if(e.key=="Escape"){$("modal").innerHTML="";document.querySelector(".menu")?.remove()}});

/* ════════════ boot ════════════ */
(async()=>{try{await api("/api/me");await start()}catch(e){if(!S.me)renderLogin()}})();
</script>
</body>
